## Do not set the "OnFailure" toplevel override use for the other services
# This is done to prevent recursion on calling user-failure-notification from itself (for example, if the user-failure-notification itself fails)
# See: https://bbs.archlinux.org/viewtopic.php?pid=1956395#p1956395 and https://wiki.archlinux.org/title/Systemd#Notifying_about_failed_services
